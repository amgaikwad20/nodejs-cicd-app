apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-cicd-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-cicd-app

  template:
    metadata:
      labels:
        app: nodejs-cicd-app

    spec:
      containers:
        - name: nodejs-cicd-app
          image: YOUR_DOCKERHUB_USERNAME/nodejs-cicd-app:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
